<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3つだけTODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>3つだけTODO</h1>

    <!-- 今日の日付（例: 2026年10月5日（月）） -->
    <p id="today"></p>

    <!-- 入力フォーム -->
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="やることを入力" maxlength="50" required>
      <button type="submit">追加</button>
    </form>

    <!-- 件数表示（例: 1 / 3） -->
    <p id="count"></p>

    <!-- 達成状況（例: 今日の達成状況：2 / 3件完了） -->
    <p id="progress"></p>

    <!-- 3件すべて完了したときのお祝い表示 -->
    <p id="complete-message" hidden>🎉 今日も完了！</p>

    <!-- メッセージ表示（3件を超えたときなど） -->
    <p id="message"></p>

    <!-- TODO一覧 -->
    <ul id="todo-list"></ul>

    <!-- 達成履歴 -->
    <section id="history-section">
      <h2>達成履歴</h2>
      <p id="achievement-days">達成日数：0日</p>
      <p id="month-days">今月：0日達成</p>
      <p id="month-rate">月間達成率：0%</p>
      <div class="rate-bar" role="progressbar" aria-label="月間達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="month-rate-bar" class="rate-bar-fill"></div>
      </div>
      <p id="streak-days">連続達成日数：0日</p>
      <p id="best-streak-days">最高連続達成日数：0日</p>
      <p id="week-days">直近7日間：0 / 7日達成</p>
      <p id="week-rate">達成率：0%</p>
      <div class="rate-bar" role="progressbar" aria-label="直近7日間の達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="week-rate-bar" class="rate-bar-fill"></div>
      </div>
      <!-- 直近7日間の達成数に応じたひとこと -->
      <p id="week-message"></p>
      <!-- 直近7日間の日ごとの達成状況（○ / ×） -->
      <ul id="week-list"></ul>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
