<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3つだけTODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>3つだけTODO</h1>

    <!-- 今日の日付（例: 2026年10月5日（月）） -->
    <p id="today"></p>

    <!-- 入力フォーム -->
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="やることを入力" maxlength="50" required>
      <button type="submit">追加</button>
    </form>

    <!-- 件数表示（例: 1 / 3） -->
    <p id="count"></p>

    <!-- 達成状況（例: 今日の達成状況：2 / 3件完了） -->
    <p id="progress"></p>

    <!-- 3件すべて完了したときのお祝い表示 -->
    <p id="complete-message" hidden>🎉 今日も完了！</p>

    <!-- メッセージ表示（3件を超えたときなど） -->
    <p id="message"></p>

    <!-- TODO一覧 -->
    <ul id="todo-list"></ul>

    <!-- 達成履歴 -->
    <section id="history-section">
      <h2>達成履歴</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
